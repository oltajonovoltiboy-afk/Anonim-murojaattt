# Urganch davlat akademik litseyi Murojaat tizimi uchun Nginx konfiguratsiyasi

upstream murojaat_web {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Rate limiting zonasi
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    server_name murojaat.litsey.uz; # O'z domeningizni kiriting

    # Katta fayllar (PDF, video, hujjatlar) yuklash uchun maksimal hajm
    client_max_body_size 25M;

    # Xavfsizlik sarlavhalari
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API va Web Panel uchun proxy
    location / {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://murojaat_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout sozlamalari
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
